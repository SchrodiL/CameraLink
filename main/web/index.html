  /* 标题字体：中文走内嵌的凌黑体子集，子集里没有的字符（拉丁/数字）自动落到 ROG。 */
  --font-heading: "CamLink LingHei", var(--font-display);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
}
header {
  padding: 14px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
header h1 {
  font-family: var(--font-heading);
  font-size: 24px; margin: 0; font-weight: 400; letter-spacing: 1.5px;
  padding-bottom: 1px;
  border-bottom: 2px solid var(--orange);
}
nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
nav button {
  background: var(--panel); color: var(--muted); border: 1px solid var(--border);
  padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
  font-family: var(--font-heading);
}
nav button.active { color: var(--text); border-color: var(--accent); background: #22303f; }
main { padding: 16px 18px; max-width: 760px; margin: 0 auto; }
section { display: none; }
section.active { display: block; }
.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px; margin-bottom: 14px;
}
.card h2 {
  font-family: var(--font-heading);
  font-size: 17px; margin: 0 0 12px; color: var(--text);
  font-weight: 400; letter-spacing: 1px;
}
.row { display: flex; align-items: center; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
label { color: var(--muted); min-width: 70px; }
input[type=number], select, input[type=text] {
  background: #0f141a; color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 8px; font-size: 14px;
}
input[type=number] { width: 90px; }
button.btn {
  background: var(--accent); color: #06101c; border: 0; border-radius: 6px;
  padding: 8px 14px; cursor: pointer; font-size: 14px; font-weight: 600;
}
button.btn.secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
button.btn.danger { background: var(--err); color: #fff; }
.status-badge { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--ok); }
.dot.off { background: var(--err); }
.dot.warn { background: var(--warn); }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 10px; }
.kv b { color: var(--muted); font-weight: 500; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 13px; }
th { color: var(--muted); font-weight: 500; }
#toast {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  background: #22303f; border: 1px solid var(--accent); color: var(--text);
  padding: 10px 16px; border-radius: 8px; display: none; z-index: 10;
}
/* 通道条容器。通道号标签是绝对定位在条下方的（bottom:-18px），不占容器高度，
 * 所以必须用 margin-bottom 在外面预留出这段空间，否则标签会顶到卡片下边框上。 */
.ch-bars { display: flex; gap: 4px; align-items: flex-end; height: 60px; margin-bottom: 24px; }
.ch-bar { width: 16px; background: #274a6d; border-radius: 3px; position: relative; }
.ch-bar span { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: 9px; color: var(--muted); }
.ch-bar.in-range { background: var(--ok); }

/* ---- 通道映射（Betaflight Modes 风格）---- */
.cm-list { display: flex; flex-direction: column; gap: 10px; }
.cm-row {
  border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; background: #161d25;
  transition: background .12s, border-color .12s;
}
.cm-row.disabled { opacity: .5; }
.cm-row.detecting { border-color: var(--warn); }
/* 通道值落在触发范围内 —— 整个功能区高亮 */
.cm-row.triggered { background: #1c3040; border-color: var(--accent); opacity: 1; }
.cm-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cm-name { font-weight: 600; min-width: 116px; }
.cm-spacer { flex: 1; }
/* 行程条：1000~2000us 全行程。两个手柄之间（蓝色）= 触发范围，
   细竖线 = 通道当前值（进范围变绿），手柄可直接拖动。 */
.cm-bar {
  position: relative; height: 30px; margin: 10px 0 4px;
  background: #0d141b; border: 1px solid var(--border); border-radius: 4px;
  touch-action: none;            /* 拖手柄时不要触发页面滚动 */
  user-select: none;
}
.cm-bar .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: #1e2833; }
.cm-bar .fill {
  position: absolute; top: 0; bottom: 0;
  background: rgba(77,163,255,.32);
  border-left: 1px solid var(--accent); border-right: 1px solid var(--accent);
  cursor: grab;                  /* 拖中间 = 整条范围平移 */
}
.cm-bar .fill:active { cursor: grabbing; }
.cm-bar .live {
  position: absolute; top: -3px; bottom: -3px; width: 2px;
  background: var(--warn); box-shadow: 0 0 4px rgba(0,0,0,.7);
}
.cm-bar .live.in-range { background: var(--ok); }
.cm-bar .h {
  position: absolute; top: -4px; bottom: -4px; width: 16px; margin-left: -8px;
  background: var(--accent); border-radius: 3px; cursor: ew-resize;
  box-shadow: 0 0 0 1px #0b1520;
}
.cm-bar .h::after {
  content: ''; position: absolute; left: 7px; top: 6px; bottom: 6px;
  width: 2px; background: rgba(0,0,0,.5);
}
.cm-scale {
  display: flex; justify-content: space-between;
  font-size: 10px; color: var(--muted); margin-bottom: 2px;
}
.cm-foot { display: flex; justify-content: flex-end; font-size: 12px; }

/* ---- 二次确认弹窗 ---- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.62);
  display: flex; align-items: center; justify-content: center;
  z-index: 20; padding: 20px;
}
.modal-backdrop[hidden] { display: none; }
.modal {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  padding: 18px; width: 100%; max-width: 430px;
  box-shadow: 0 14px 44px rgba(0,0,0,.55);
}
.modal h3 { margin: 0 0 10px; font-size: 15px; }
.modal p { margin: 0 0 16px; font-size: 13px; line-height: 1.75; color: var(--text); }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

/* ---- 二选一滑块开关 ---- */
/* 用于「协议」（DJI / Insta360）和「WiFi」（关 / 开）这类只有两个状态、
 * 且互斥的开关。比下拉框+按钮更直观：一眼看出当前在哪档、点另一档即切换。 */
.seg {
  position: relative; display: inline-flex; padding: 3px;
  background: #0f141a; border: 1px solid var(--border); border-radius: 999px;
  user-select: none;
}
.seg-thumb {
  position: absolute; top: 3px; bottom: 3px; left: 3px;
  width: calc(50% - 3px);          /* 预置值，JS 会用实测宽度覆盖 */
  background: var(--accent); border-radius: 999px;
  transition: transform .18s ease, width .18s ease;
}
.seg-btn {
  position: relative; z-index: 1;
  background: none; border: 0; cursor: pointer;
  padding: 5px 14px; border-radius: 999px;
  font-size: 13px; font-family: var(--font-heading);
  color: var(--muted); transition: color .18s;
}
.seg-btn.on { color: #06101c; }
/* 请求已发出、等后端确认 —— 变淡提示「还没定下来」 */
.seg.pending { opacity: .65; }

<body>
<header>
  <h1>CamLink</h1>
  <nav id="nav"></nav>
</header>
<main>
  <section id="tab-main" class="active">
    <div class="card">
      <h2>连接状态</h2>
      <div class="row">
        <span class="status-badge"><span class="dot" id="gps-dot"></span> GPS（外接）</span>
        <span class="status-badge"><span class="dot" id="gps-fc-dot"></span> GPS（飞控）</span>
      </div>
      <div class="kv" id="status-kv"></div>
    </div>
    <div class="card">
      <h2>GPS</h2>
      <div class="row">
        <label>飞控 GPS</label>
        <div class="seg" id="gps-dir-seg" data-sel="0">
          <span class="seg-thumb"></span>
          <button class="seg-btn">读</button>
          <button class="seg-btn">写</button>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>RC 通道实时值</h2>
      <div class="ch-bars" id="ch-bars"></div>
    </div>

    <div class="card">
      <h2>OSD 槽位布局</h2>
      <div id="osd-slots"></div>
      <div class="row">
        <label>低电量报警 %</label>
        <input type="number" id="osd-batt" min="0" max="100">
        <span class="mono" style="color:var(--muted)">0 = 关闭，仅大疆可用</span>
      </div>
      <div class="row"><button class="btn" onclick="saveOsd()">保存 OSD 配置</button></div>
    </div>

    <div class="card">
      <h2>协议与对频</h2>
      <div class="row">
        <label>协议</label>
        <div class="seg" id="proto-seg" data-sel="0">
          <span class="seg-thumb"></span>
          <button class="seg-btn">DJI</button>
          <button class="seg-btn">Insta360</button>
        </div>
      </div>
      <div class="row">
        <button class="btn secondary" onclick="pairStart()">开始对频</button>
        <span style="color:var(--muted)">对频会关闭 WiFi</span>
      </div>
    </div>
    <div class="card">
      <h2>WiFi 设置</h2>
      <div class="row">
        <label>WiFi</label>
        <div class="seg" id="wifi-seg" data-sel="0">
          <span class="seg-thumb"></span>
          <button class="seg-btn">关</button>
          <button class="seg-btn">开</button>
        </div>
      </div>
      <div class="row">
        <label>空闲判定时长</label>
        <input type="number" id="wifi-auto-delay" min="1" max="3600">
        <button class="btn" onclick="saveWifi()">保存</button>
      </div>
    </div>
  </section>

  <section id="tab-chmap">
    <div class="card">
      <h2>通道映射</h2>
      <div class="cm-list" id="chmap-rows"></div>
      <div class="row" style="margin-top:14px">
        <button class="btn" onclick="saveChmap()">保存通道映射</button>
      </div>
    </div>
  </section>

  <section id="tab-maint">
    <div class="card">
      <h2>刷写固件</h2>
      <div class="row">
        <input type="file" id="ota-file" accept=".bin">
        <button class="btn" onclick="doOta()">刷写</button>
      </div>
      <p style="color:var(--warn)">升级完成后设备会自动重启。请勿断开电源。</p>
    </div>

    <div class="card">
      <h2>配置备份 / 恢复</h2>
      <div class="row">
        <button class="btn" onclick="doBackup()">导出配置</button>
        <input type="file" id="restore-file" accept=".json">
        <button class="btn secondary" onclick="doRestore()">导入配置</button>
      </div>
    </div>

    <div class="card">
      <h2>恢复默认设置</h2>
      <p style="color:var(--muted)">清空全部设置并重启，固件本身不受影响。</p>
      <div class="row">
        <button class="btn danger" onclick="factoryReset()">恢复默认设置</button>
      </div>
    </div>
  </section>
</main>
<div id="toast"></div>

<div id="modal" class="modal-backdrop" hidden>
  <div class="modal">
    <h3 id="modal-title"></h3>
    <p id="modal-body"></p>
    <div class="modal-actions">
      <button class="btn secondary" id="modal-cancel">取消</button>
      <button class="btn danger" id="modal-ok">确认</button>
    </div>
  </div>
</div>

<script>
const TABS = [
  ['tab-main', '通用'], ['tab-chmap', '通道映射'], ['tab-maint', '备份 / 升级'],
];
const OSD_ITEMS = ['录制状态', 'GPS 卫星数', '速度+海拔', '相机电量', '录制规格', '名称+剩余容量', 'GPS 纬度', 'GPS 经度'];
/* [功能号, 显示名]。功能号必须与固件 channel_func_t 的顺序一致。 */
const FUNCS = [
  [1, '快门 / 录制'],
  [2, '协议切换'],
  [3, '对频'],
  [4, '切换相机预设'],
  [5, '睡眠 / 唤醒'],
  [6, '关机'],
  [7, '深度唤醒'],
];

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2500);
}

/* ---- 导航 ---- */
function buildNav() {
  const nav = document.getElementById('nav');
  TABS.forEach(([id, name]) => {
    const b = document.createElement('button');
    b.textContent = name; b.dataset.tab = id;
    b.onclick = () => showTab(id);
    nav.appendChild(b);
  });
}
function showTab(id) {
  document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.getElementById(id).classList.add('active');
}

/* ---- HTTP 辅助 ---- */
async function jget(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function jsend(method, url, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/* ---- 状态 ---- */
function renderChBars(ch, active) {
  const el = document.getElementById('ch-bars');
  el.innerHTML = '';
  ch.forEach((v, i) => {
    const d = document.createElement('div');
    d.className = 'ch-bar';
    d.style.height = Math.max(2, Math.min(100, (v - 900) / 1200 * 100)) + '%';
    if (active[i]) d.classList.add('in-range');
    const s = document.createElement('span'); s.textContent = i + 1;
    d.appendChild(s); el.appendChild(d);
  });
}
async function pollStatus() {
  try {
    const s = await jget('/api/status');
    /* 两个状态灯：外接 GNSS / 飞控 GPS。
     * 绿 = 有定位，黄 = 连着但还没定位（搜星中），红 = 没有这个来源 */
    const setDot = (id, present, valid) => {
      const el = document.getElementById(id);
      if (el) el.className = 'dot ' + (valid ? 'on' : (present ? 'warn' : 'off'));
    };
    setDot('gps-dot',    s.gps.local_present, s.gps.local_valid);
    setDot('gps-fc-dot', s.gps.fc_present,    s.gps.fc_valid);

    renderWifi(s.wifi_on);
    document.getElementById('wifi-auto-delay').value = s.wifi_auto_delay;

    const kv = document.getElementById('status-kv');
    const proto = s.protocol === 1 ? 'Insta360' : 'DJI';
    protoSync(s);
    renderGpsDir(s.gps_dir);

    /* 当前定位来自哪个源、精度多少 —— 融合是否生效一眼可见 */
    const gsrc = ['无', '本地', '飞控', '融合'][s.gps.source] || '无';
    const gacc = (s.gps.valid && s.gps.h_acc_m > 0) ? ' ±' + s.gps.h_acc_m.toFixed(1) + 'm' : '';
    kv.innerHTML = [
      ['协议', proto + (s.paired ? ' (已对频)' : ' (未对频)')],
      ['GPS 来源', gsrc + gacc],
      ['卫星数', s.gps.satellites],
      ['GPS 定位', s.gps.valid ? '有效' : (s.gps.connected ? '搜星中' : '未连接')],
      ['纬度', s.gps.valid ? s.gps.lat.toFixed(6) : '--'],
      ['经度', s.gps.valid ? s.gps.lon.toFixed(6) : '--'],
      ['速度', s.gps.speed_ms.toFixed(1) + ' m/s'],
      ['海拔', s.gps.altitude_m.toFixed(0) + ' m'],
    ].map(([k, v]) => '<b>' + k + '</b><span>' + v + '</span>').join('');

    updateChmapLive(s.channels);
    renderChBars(s.channels, chmapActiveChannels(s.channels));
  } catch (e) { /* ignore */ }
}

/* ---- OSD ---- */
function buildOsd() {
  const el = document.getElementById('osd-slots');
  el.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const row = document.createElement('div');
    row.className = 'row';
    const l = document.createElement('label'); l.textContent = '槽位 ' + (i + 1);
    const sel = document.createElement('select'); sel.id = 'osd-slot-' + i;
    OSD_ITEMS.forEach((n, v) => {
      const o = document.createElement('option'); o.value = v; o.textContent = n;
      sel.appendChild(o);
    });
    row.appendChild(l); row.appendChild(sel); el.appendChild(row);
  }
}
async function loadOsd() {
  const d = await jget('/api/osd');
  d.slots.forEach((v, i) => { document.getElementById('osd-slot-' + i).value = v; });
  document.getElementById('osd-batt').value = d.batt_alarm;
}
async function saveOsd() {
  const slots = [0, 1, 2, 3].map(i => parseInt(document.getElementById('osd-slot-' + i).value, 10));
  const batt = parseInt(document.getElementById('osd-batt').value, 10) || 0;
  await jsend('PUT', '/api/osd', { slots, batt_alarm: batt });
  toast('OSD 配置已保存');
}

/* ---- 二选一滑块开关（公用）---- */
/* segSet 只改显示状态；segBind 绑点击，只在真的换档时才回调。
 *
 * 蓝色滑块的位置和宽度**按实际按钮实测**，不用 calc(50%)：两个标签的宽度
 * 往往不等（「DJI」vs「Insta360」），按 50% 算会盖不住正确的档位。 */
function segSet(id, sel) {
  const el = document.getElementById(id);
  if (!el) return;
  el.dataset.sel = sel ? '1' : '0';

  const btns = el.querySelectorAll('.seg-btn');
  btns.forEach((b, i) => b.classList.toggle('on', i === sel));

  const act = btns[sel];
  const thumb = el.querySelector('.seg-thumb');
  if (act && thumb) {
    /* offsetLeft 相对 .seg（它是 offsetParent，position:relative），
     * 减去容器 3px 内边距才是滑块的位移起点。 */
    thumb.style.width = act.offsetWidth + 'px';
    thumb.style.transform = 'translateX(' + (act.offsetLeft - 3) + 'px)';
  }
}
function segBind(id, onPick) {
  const el = document.getElementById(id);
  if (!el) return;
  el.querySelectorAll('.seg-btn').forEach((b, i) => {
    b.onclick = () => {
      if (el.dataset.sel === (i ? '1' : '0')) return;   /* 已经是这档，不重发 */
      onPick(i);
    };
  });
}

/* ---- 协议 ---- */
async function loadProtocol() {
  const d = await jget('/api/protocol');
  segSet('proto-seg', d.mode);
}

/* 状态轮询每 2 秒跑一次，滑块位置**不能**在请求发出后就被轮询顶回旧值——
 * 那样用户点了没反应（下拉框时代的老问题）。所以点下新档后暂停轮询同步，
 * 直到后端真的报出目标协议（或超时失败）；期间滑块停在目标档但整体变淡，
 * 提示「还没定下来」。 */
let protoWant = null;      /* 用户选中的目标协议；null = 没有待确认的选择 */
let protoWantAt = 0;

async function setProtocolTo(v) {
  protoWant = v;
  protoWantAt = Date.now();
  segSet('proto-seg', v);
  document.getElementById('proto-seg').classList.add('pending');
  await jsend('PUT', '/api/protocol', { mode: v });
  toast('正在切换协议…');
}

/* 轮询里调用：有待确认的选择时不覆盖滑块，并判断是否已生效 / 超时 */
function protoSync(s) {
  const el = document.getElementById('proto-seg');

  if (protoWant === null) {
    segSet('proto-seg', s.protocol);
    return;
  }
  if (s.protocol === protoWant) {          /* 已生效 */
    protoWant = null;
    el.classList.remove('pending');
    segSet('proto-seg', s.protocol);
    toast('协议已切换为 ' + (s.protocol === 1 ? 'Insta360' : 'DJI'));
  } else if (Date.now() - protoWantAt > 6000) {
    protoWant = null;                      /* 超时：放弃，滑块回到真实状态 */
    el.classList.remove('pending');
    segSet('proto-seg', s.protocol);
    toast('协议切换未生效');
  }
}
async function pairStart() { await fetch('/api/pairing/start', { method: 'POST' }); toast('开始对频'); }

/* ---- WiFi ---- */
function renderWifi(on) {
  /* 旁边的状态灯和「开/关」文字已去掉 —— 滑块停在哪个档位就是哪个状态 */
  segSet('wifi-seg', on ? 1 : 0);
}
async function saveWifi() {
  const delay = parseInt(document.getElementById('wifi-auto-delay').value, 10) || 60;
  await jsend('PUT', '/api/wifi', { auto_delay: delay });
  toast('空闲判定时长已保存');
}
async function wifiOn() { await jsend('PUT', '/api/wifi', { wifi_on: true }); renderWifi(true); toast('WiFi 已打开'); }
async function wifiOff() { await jsend('PUT', '/api/wifi', { wifi_on: false }); renderWifi(false); toast('WiFi 已关闭'); }

/* ---- GPS 方向（二选一滑块）---- */
/* 0 = 读飞控 GPS（飞控自己接了）；1 = 把本机定位输出给飞控（飞控 gps_provider=MSP）*/
function renderGpsDir(dir) {
  segSet('gps-dir-seg', dir ? 1 : 0);
}
async function setGpsDir(v) {
  renderGpsDir(v);              /* 立即反映，不必等下一轮轮询（与 WiFi 一致） */
  await jsend('PUT', '/api/gps-dir', { dir: v });
  toast(v ? '本机 GPS 将输出给飞控' : '将读取飞控的 GPS');
}

/* ---- 通道映射（Betaflight Modes 风格）---- */
const CM_MIN = 1000, CM_MAX = 2000;              /* RC 行程范围 (us) */
const CM_DEFAULT_LO = 1300, CM_DEFAULT_HI = 1700;
const CM_AUTO = -1;                              /* 下拉里「自动检测」的哨兵值 */
const CM_DETECT_MS = 10000;                      /* 自动检测窗口 */
const CM_DETECT_MIN_SPAN = 60;                   /* 小于此变化量视为没拨动 (us) */
const CM_FULL_LO = 1100, CM_FULL_HI = 1900;      /* 已扫到两端 → 可提前结束检测 */

const cmState = {};   /* func -> {min, max}，UI 侧真值；手柄位置由它算出来 */
const cmLast  = {};   /* func -> 上一次确定选中的通道，自动检测失败时回退用 */
let detect = {};      /* func -> {until, prev, lo[16], hi[16]}，正在自动检测的功能 */
let detectTimer = null;

function cmEl(id) { return document.getElementById(id); }

/* 值 → 行程条上的百分比位置 */
function cmPct(v) {
  return Math.min(100, Math.max(0, (v - CM_MIN) / (CM_MAX - CM_MIN) * 100));
}

function buildChmap() {
  const el = cmEl('chmap-rows');
  el.innerHTML = '';

  FUNCS.forEach(([f, name]) => {
    const row = document.createElement('div');
    row.className = 'cm-row disabled';
    row.id = 'cm-row-' + f;

    let opts = '<option value="0">未分配</option>' +
               '<option value="' + CM_AUTO + '">自动检测…</option>';
    for (let i = 1; i <= 16; i++) opts += '<option value="' + i + '">CH' + i + '</option>';

    row.innerHTML =
      '<div class="cm-head">' +
        '<span class="cm-name">' + name + '</span>' +
        '<span class="cm-spacer"></span>' +
        '<select id="cm-ch-' + f + '" onchange="cmOnChan(' + f + ')">' + opts + '</select>' +
      '</div>' +
      '<div class="cm-bar" id="cm-bar-' + f + '">' +
        '<div class="fill" id="cm-fill-' + f + '"></div>' +
        '<div class="live" id="cm-live-' + f + '"></div>' +
        '<div class="h" id="cm-hmin-' + f + '"></div>' +
        '<div class="h" id="cm-hmax-' + f + '"></div>' +
      '</div>' +
      '<div class="cm-scale"><span>1000</span><span>1250</span><span>1500</span><span>1750</span><span>2000</span></div>' +
      '<div class="cm-foot mono" id="cm-val-' + f + '"></div>';
    el.appendChild(row);

    /* 刻度线插到最前面，免得盖住范围块和手柄 */
    const bar = cmEl('cm-bar-' + f);
    for (let i = 1; i < 10; i++) {
      const t = document.createElement('div');
      t.className = 'tick'; t.style.left = (i * 10) + '%';
      bar.insertBefore(t, bar.firstChild);
    }

    cmEl('cm-fill-' + f).addEventListener('pointerdown', (e) => cmPan(f, e));
    cmEl('cm-hmin-' + f).addEventListener('pointerdown', (e) => cmDrag(f, 'min', e));
    cmEl('cm-hmax-' + f).addEventListener('pointerdown', (e) => cmDrag(f, 'max', e));

    cmState[f] = { min: CM_DEFAULT_LO, max: CM_DEFAULT_HI };
    cmRender(f);
  });
}

/* 写入触发范围（自动钳制到行程内、保证 min<=max、按 5us 取整） */
function cmSetRange(f, lo, hi) {
  const snap = (v) => Math.max(CM_MIN, Math.min(CM_MAX, Math.round(v / 5) * 5));
  lo = snap(lo); hi = snap(hi);
  if (lo > hi) { const t = lo; lo = hi; hi = t; }
  cmState[f] = { min: lo, max: hi };
  cmRender(f);
}


/* 从 DOM 读该功能当前配置（下拉停在 -1/自动 时视为未分配） */
function cmRow(f) {
  const chn = parseInt(cmEl('cm-ch-' + f).value, 10);
  const st = cmState[f] || { min: CM_DEFAULT_LO, max: CM_DEFAULT_HI };
  return { channel: chn > 0 ? chn : 0, min: st.min, max: st.max };
}

/* 画出范围手柄、蓝色范围块、数值文字；未分配时整体隐藏 */
function cmRender(f) {
  const row = cmEl('cm-row-' + f);
  const on = cmRow(f).channel > 0;
  const st = cmState[f] || { min: CM_DEFAULT_LO, max: CM_DEFAULT_HI };
  const a = cmPct(st.min), b = cmPct(st.max);

  row.classList.toggle('disabled', !on);

  cmEl('cm-fill-' + f).style.left = a + '%';
  cmEl('cm-fill-' + f).style.width = Math.max(0, b - a) + '%';
  cmEl('cm-hmin-' + f).style.left = a + '%';
  cmEl('cm-hmax-' + f).style.left = b + '%';

  ['cm-fill-', 'cm-hmin-', 'cm-hmax-', 'cm-live-'].forEach((p) => {
    cmEl(p + f).style.display = on ? '' : 'none';
  });
  cmEl('cm-val-' + f).textContent = on ? '触发范围 ' + st.min + ' – ' + st.max + ' µs' : '';
  if (!on) row.classList.remove('triggered');
}

function cmOnChan(f) {
  const v = parseInt(cmEl('cm-ch-' + f).value, 10);

  if (v === CM_AUTO) {                 /* 选「自动检测…」→ 开始监听通道变化 */
    cmArmDetect(f, cmLast[f] === undefined ? 0 : cmLast[f]);
    return;
  }
  cmCancelDetect(f);
  cmLast[f] = v > 0 ? v : 0;
  cmRender(f);
}

/* 手柄拖动：像素位置 → 通道值 */
function cmValAt(bar, clientX) {
  const r = bar.getBoundingClientRect();
  const p = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
  return CM_MIN + p * (CM_MAX - CM_MIN);
}

/* 通用：按下后跟随指针拖动，抬起/取消自动解绑 */
function cmTrackPointer(move, downEv) {
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
  move(downEv);
}

function cmDrag(f, which, ev) {
  ev.preventDefault();
  const bar = cmEl('cm-bar-' + f);

  cmTrackPointer((e) => {
    const v = cmValAt(bar, e.clientX);
    const st = cmState[f] || { min: CM_DEFAULT_LO, max: CM_DEFAULT_HI };
    /* 两个手柄不交叉：拖 min 时以 max 为上限，反之亦然 */
    if (which === 'min') cmSetRange(f, Math.min(v, st.max), st.max);
    else                 cmSetRange(f, st.min, Math.max(v, st.min));
  }, ev);
}

/* 拖范围块中间：整条范围平移，宽度保持不变 */
function cmPan(f, ev) {
  ev.preventDefault();
  const bar = cmEl('cm-bar-' + f);
  const st0 = cmState[f] || { min: CM_DEFAULT_LO, max: CM_DEFAULT_HI };
  const width = st0.max - st0.min;
  const offset = cmValAt(bar, ev.clientX) - st0.min;   /* 按在范围里的相对位置 */

  cmTrackPointer((e) => {
    let lo = cmValAt(bar, e.clientX) - offset;
    /* 贴到两端时整条一起顶住，宽度不变 —— 交给 cmSetRange 各自钳制会把范围压扁 */
    if (lo < CM_MIN) lo = CM_MIN;
    if (lo + width > CM_MAX) lo = CM_MAX - width;
    cmSetRange(f, lo, lo + width);
  }, ev);
}

/* 更新实时指针；落在触发范围内则高亮整个功能区 */
function updateChmapLive(ch) {
  FUNCS.forEach(([f]) => {
    const sel = cmEl('cm-ch-' + f);
    if (!sel) return;
    const row = cmEl('cm-row-' + f);
    const chn = parseInt(sel.value, 10);

    if (!(chn > 0)) {                  /* 未分配 / 正在自动检测 */
      cmEl('cm-live-' + f).style.display = 'none';
      row.classList.remove('triggered');
      return;
    }
    const st = cmState[f] || { min: CM_DEFAULT_LO, max: CM_DEFAULT_HI };
    const v = ch[chn - 1];
    const inRange = (v >= st.min && v <= st.max);

    const live = cmEl('cm-live-' + f);
    live.style.display = '';
    live.style.left = cmPct(v) + '%';
    live.classList.toggle('in-range', inRange);
    row.classList.toggle('triggered', inRange);
  });
}

/* 当前有功能处于激活态的通道（状态页高亮用） */
function chmapActiveChannels(ch) {
  const act = new Array(16).fill(false);
  FUNCS.forEach(([f]) => {
    if (!cmEl('cm-ch-' + f)) return;   /* 通道页尚未构建时不报错 */
    const b = cmRow(f);
    if (b.channel === 0) return;
    const v = ch[b.channel - 1];
    if (v >= b.min && v <= b.max) act[b.channel - 1] = true;
  });
  return act;
}

/* ---- 自动检测通道（下拉里选「自动检测…」触发）---- */
function cmArmDetect(f, prev) {
  detect[f] = {
    until: Date.now() + CM_DETECT_MS,
    prev: prev,                       /* 失败时回退到的通道 */
    lo: new Array(16).fill(9999),
    hi: new Array(16).fill(0),
  };
  cmEl('cm-row-' + f).classList.add('detecting');
  cmEl('cm-val-' + f).textContent = '请拨动开关 / 摇杆…';
  if (!detectTimer) cmDetectTick();
}

function cmCancelDetect(f) {
  if (!detect[f]) return;
  delete detect[f];
  cmEl('cm-row-' + f).classList.remove('detecting');
}

/* best < 0 表示整个窗口内没检测到有效变化 */
function cmFinishDetect(f, best, lo, hi) {
  const d = detect[f];
  delete detect[f];
  cmEl('cm-row-' + f).classList.remove('detecting');
  if (!d) return;

  if (best < 0) {
    cmEl('cm-ch-' + f).value = d.prev;
    cmLast[f] = d.prev;
    cmRender(f);
    toast('没检测到通道变化，拨动开关后重试');
    return;
  }

  cmEl('cm-ch-' + f).value = best + 1;
  cmLast[f] = best + 1;
  cmSetRange(f, lo, hi);              /* 用实测到的行程作为初始触发范围 */
  toast('已识别为 CH' + (best + 1));
}

async function cmDetectTick() {
  detectTimer = null;
  try {
    const s = await jget('/api/status');
    updateChmapLive(s.channels);

    for (const f of Object.keys(detect)) {
      const d = detect[f];
      if (!d) continue;

      for (let i = 0; i < 16; i++) {
        if (s.channels[i] < d.lo[i]) d.lo[i] = s.channels[i];
        if (s.channels[i] > d.hi[i]) d.hi[i] = s.channels[i];
      }

      /* 取变化幅度最大的通道 */
      let best = -1, span = 0;
      for (let i = 0; i < 16; i++) {
        const sp = d.hi[i] - d.lo[i];
        if (sp > span) { span = sp; best = i; }
      }

      if (best >= 0 && d.lo[best] <= CM_FULL_LO && d.hi[best] >= CM_FULL_HI) {
        /* 已经扫到两端（开关拨到底），不必等满整个窗口 */
        cmFinishDetect(f, best, d.lo[best], d.hi[best]);
      } else if (Date.now() >= d.until) {
        if (best >= 0 && span >= CM_DETECT_MIN_SPAN) {
          cmFinishDetect(f, best, d.lo[best], d.hi[best]);
        } else {
          cmFinishDetect(f, -1, 0, 0);
        }
      }
    }
  } catch (e) { /* 单次失败不影响整个检测窗口 */ }
  if (Object.keys(detect).length > 0) detectTimer = setTimeout(cmDetectTick, 120);
}

/* ---- 读写 ---- */
async function loadChmap() {
  const d = await jget('/api/chmap');
  const cache = {};
  d.bindings.forEach(b => { cache[b.func] = b; });
  FUNCS.forEach(([f]) => {
    const b = cache[f] || { channel: 0, min: 0, max: 0 };
    cmEl('cm-ch-' + f).value = b.channel;
    cmLast[f] = b.channel;
    /* 未分配的保持默认范围，这样一分配就能直接微调 */
    if (b.channel > 0 && b.max > b.min) cmState[f] = { min: b.min, max: b.max };
    cmRender(f);
  });
}

async function saveChmap() {
  const bindings = FUNCS.map(([f]) => {
    const b = cmRow(f);
    return { func: f, channel: b.channel, min: b.min, max: b.max };
  });
  await jsend('PUT', '/api/chmap', { bindings });
  toast('通道映射已保存');
}

/* ---- 固件 ---- */
async function doOta() {

/* ---- 二次确认弹窗 ---- */
/* 不用原生 confirm()：浏览器被勾了「禁止此页面再弹出对话框」之后会静默返回 false，
 * 对不可撤销的操作来说行为不可控，而且样式也和界面不搭。返回 Promise<boolean>。 */
function confirmDialog(title, bodyHtml, okLabel) {
  return new Promise((resolve) => {
    const bd = document.getElementById('modal');
    const btnOk = document.getElementById('modal-ok');
    const btnCancel = document.getElementById('modal-cancel');

    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = bodyHtml;
    btnOk.textContent = okLabel || '确认';

    const done = (v) => {
      bd.hidden = true;
      btnOk.onclick = btnCancel.onclick = bd.onclick = null;
      document.removeEventListener('keydown', onKey);
      resolve(v);
    };
    const onKey = (e) => { if (e.key === 'Escape') done(false); };

    btnOk.onclick = () => done(true);
    btnCancel.onclick = () => done(false);
    bd.onclick = (e) => { if (e.target === bd) done(false); };   /* 点遮罩 = 取消 */
    document.addEventListener('keydown', onKey);

    bd.hidden = false;
    btnCancel.focus();     /* 默认焦点给「取消」，避免回车误触发 */
  });
}

/* 恢复默认设置 */
async function factoryReset() {
  const ok = await confirmDialog(
    '恢复默认设置',
    '这会清空<b>全部设置</b>并重启设备：<br>' +
    '协议、对频记录、通道映射、OSD 布局、Insta360 学到的机型与唤醒 ID、WiFi 空闲时长。' +
    '<br><br>固件本身不受影响。' +
    '<br><br><b style="color:var(--err)">此操作不可撤销。</b>',
    '确认恢复'
  );
  if (!ok) return;

  toast('正在清除设置…');
  try {
    await fetch('/api/factory-reset', { method: 'POST' });
  } catch (e) { /* 设备随即重启，连接中断是正常的 */ }
  toast('设置已清除，设备正在重启…');
}

/* ---- 启动 ---- */
async function init() {
  buildNav();
  buildOsd();
  buildChmap();

  /* 三个二选一滑块：点另一档即生效，不需要额外的确认按钮 */
  segBind('proto-seg', setProtocolTo);
  segBind('wifi-seg', (v) => { if (v) wifiOn(); else wifiOff(); });
  segBind('gps-dir-seg', setGpsDir);

  try {
    await Promise.all([loadOsd(), loadProtocol(), loadChmap()]);
  } catch (e) { /* ignore */ }
  pollStatus();
  setInterval(pollStatus, 2000);
}
init();
